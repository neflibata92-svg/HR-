server {
    listen 80;
    server_name _;

    location /auth/ {
        proxy_pass http://api:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
    }
}
