[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening"
version = "0.1.0"
description = "BOSS resume screening MVP monorepo"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pytest>=8.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "playwright>=1.49",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/domain/src",
  "apps/api/src",
  "apps/agent/src",
]
testpaths = ["tests"]
