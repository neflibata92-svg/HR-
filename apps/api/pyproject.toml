[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "resume-domain",
]

[tool.setuptools.packages.find]
where = ["src"]
